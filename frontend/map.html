<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="description" content="De-identified surveillance map of reported and historical Noma cases." />
<title>lumos.health — Case Map</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
</head>
<body>

<nav class="nav">
  <a class="nav-brand" href="index.html">
    <div class="nav-logo">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M22 12h-4l-3 9L9 3l-3 9H2" /></svg>
    </div>
    <div>
      <div class="nav-name">lumos.health</div>
      <div class="nav-sub">Case surveillance map</div>
    </div>
  </a>
  <a class="nav-link" href="index.html">
    <svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <polyline points="15 18 9 12 15 6" />
    </svg>
    Back
  </a>
</nav>

<main>
  <div id="map" role="application" aria-label="Map of reported and historical Noma cases"></div>

  <div class="legend">
    <div class="legend-title">Triage</div>
    <div class="legend-item"><div class="leg-dot" style="background:#e84040"></div>Urgent</div>
    <div class="legend-item"><div class="leg-dot" style="background:#f59e0b"></div>Refer</div>
    <div class="legend-item"><div class="leg-dot" style="background:#3b82f6"></div>Monitor</div>
    <div class="legend-item"><div class="leg-dot" style="background:#22c55e"></div>Healthy</div>
    <div class="legend-divider">
      <div class="legend-item"><div class="leg-dot" style="background:#a855f7"></div>Historical</div>
    </div>
  </div>

  <div class="stats-panel">
    <div class="stats-title">Summary</div>
    <div class="stat-row"><div class="stat-label">Reported cases</div><div class="stat-val" id="s-total">—</div></div>
    <div class="stat-row"><div class="stat-label">Urgent</div><div class="stat-val" style="color:#e84040" id="s-urgent">—</div></div>
    <div class="stat-row"><div class="stat-label">Refer</div><div class="stat-val" style="color:#f59e0b" id="s-refer">—</div></div>
    <div class="stat-row"><div class="stat-label">Historical</div><div class="stat-val" style="color:#a855f7" id="s-historical">—</div></div>
    <p class="privacy-note">
      Locations are rounded to roughly one kilometre. No patient or reporter details
      are published.
    </p>
  </div>

  <div class="loading" id="loading">
    <div class="spinner" aria-hidden="true"></div>
    Loading cases…
  </div>
</main>

<script type="module" src="/src/map-page.js"></script>
</body>
</html>
